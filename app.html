<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1b2d"><title>Tierrez AI</title>
<style>:root{--bg:#f4f6f8;--sf:#fff;--tx:#0f1b2d;--mu:#5d6b7e;--ln:#dde3ea;--ac:#0e8f7e;padding-top:env(safe-area-inset-top)}

.r{display:flex;justify-content:space-between;gap:8px;align-items:center}img{width:56px;height:56px;border-radius:8px;object-fit:cover}</style></head><body>
<h1>Tierrez <b>AI</b></h1><div class="mu">v2 · conexão real Shopee + CJ</div><div id="m"></div><nav id="n"></nav>
<script>
var T="home",G={usd:5.5,com:14,fixa:4,imp:4,mar:25,frete:8},SL=[];try{G=Object.assign(G,JSON.parse(localStorage.tc))}catch(e){}
function K(){try{if(!localStorage.tk)localStorage.tk=prompt("Senha do app (APP_KEY)")}catch(e){}return localStorage.tk||""}
function A(p,o){o=o||{};o.headers={"x-key":K(),"Content-Type":"application/json"};return fetch(p,o).then(function(r){if(r.status==401){localStorage.removeItem("tk")}return r.json()})}
function R(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function pr(c){var d=1-(G.com+G.imp+G.mar)/100;return(c+G.frete+G.fixa)/Math.max(d,.05)}
function sv(k,v){G[k]=parseFloat(v)||0;localStorage.tc=JSON.stringify(G)}
function set(h){document.getElementById("m").innerHTML=h;document.getElementById("n").innerHTML=[["home","Painel"],["ped","Pedidos"],["chat","Chat"],["prod","Produtos"],["cfg","Preços"]].map(function(t){return'<a class="'+(T==t[0]?"on":"")+'" onclick="T=\''+t[0]+'\';go()">'+t[1]+'</a>'}).join("")}
function go(){set("<p class=mu>Carregando…</p>");
if(T=="home")A("/api/status").then(function(s){if(s.error)return set('<div class=c>'+s.error+' <button onclick="localStorage.removeItem(\'tk\');go()">Tentar de novo</button></div>');
set('<div class=c><div class=r><b>Shopee</b><span>'+(s.shopee?"✅ conectada":"❌")+'</span></div>'+(s.shopee?"":'<button onclick="location=\'/auth/shopee?k=\'+K()">Conectar loja Shopee</button>')+'<div class=r style="margin-top:8px"><b>CJ Dropshipping</b><span>'+(s.cj?"✅ chave ok":"❌ sem CJ_API_KEY")+'</span></div></div><div class=c><div class=r><div><b>Piloto automático</b><div class=mu>A cada 5 min: compra pedidos novos no CJ e responde clientes</div></div><button onclick="A(\'/api/auto\',{method:\'POST\'}).then(go)">'+(s.auto?"Desligar":"Ligar")+'</button></div></div><h2>Atividade</h2>'+s.log.slice(0,15).map(function(l){return'<div class=mu style="margin:6px 0"><b>'+l.a+'</b> · '+l.h.slice(11,16)+'<br>'+l.t+'</div>'}).join(""))});
if(T=="ped")A("/api/orders").then(function(o){if(o.error)return set('<div class=c>'+o.error+'</div>');set('<h2>Pedidos Shopee (10 dias)</h2>'+(o.length?o.map(function(x){return'<div class=c><div class=r><b>'+x.order_sn+'</b><span class=mu>'+x.order_status+'</span></div><div class=mu>'+(x.item_list||[]).map(function(i){return i.item_name+" ×"+i.model_quantity_purchased}).join(", ")+'</div>'+(x.order_status=="READY_TO_SHIP"?'<button style="margin-top:8px" onclick="this.disabled=1;A(\'/api/buy?sn='+x.order_sn+'\').then(function(){alert(\'Enviado ao CJ\')})">Comprar no CJ</button> ':"")+'<button style="margin-top:8px" onclick="A(\'/api/ship?sn='+x.order_sn+'\').then(function(r){alert(r.error||\'Rastreio Shopee: \'+(r.tracking||\'gerando…\'))})">Organizar envio</button> <button style="margin-top:8px" onclick="A(\'/api/track?sn='+x.order_sn+'\').then(function(r){alert(r.error||\'Rastreio CJ: \'+(r.track||\'ainda sem rastreio\'))})">Rastreio CJ</button></div>'}).join(""):'<div class=c>Sem pedidos.</div>'))});
if(T=="chat")A("/api/chats").then(function(l){if(l.error)return set('<div class=c>'+l.error+'</div>');window.CH=l;set('<h2>Mensagens</h2>'+(l.length?l.map(function(c,i){return'<div class=c><div class=r><b>'+c.name+'</b>'+(c.unread?'<span class=mu>'+c.unread+' nova(s)</span>':'')+'</div><div class=mu>'+c.text+'</div><input id=rp'+i+' placeholder="Sua resposta"><button onclick="sd('+i+')">Enviar</button></div>'}).join(""):'<div class=c>Sem conversas.</div>'))});
if(T=="prod")set('<h2>Buscar no CJ Dropshipping</h2><div class=r><input id=q placeholder="ex: fone bluetooth"><button onclick="bs()">Buscar</button></div><div id=l></div>');
if(T=="cfg")set('<h2>Preços e taxas</h2><div class=c>'+[["usd","Dólar (R$)"],["frete","Frete médio (R$)"],["com","Comissão Shopee %"],["fixa","Taxa fixa (R$)"],["imp","Imposto %"],["mar","Margem %"]].map(function(x){return'<label class=mu>'+x[1]+'</label><input type=number step=0.1 value="'+G[x[0]]+'" onchange="sv(\''+x[0]+'\',this.value)">'}).join("")+'</div>')}
function sd(i){var v=document.getElementById('rp'+i).value;if(!v)return;A('/api/say',{method:'POST',body:JSON.stringify({to:CH[i].to,text:v})}).then(function(r){alert(r.error||'Enviado');go()})}
function bs(){var q=document.getElementById("q").value;document.getElementById("l").innerHTML="<p class=mu>Buscando…</p>";A("/api/cj?q="+encodeURIComponent(q)).then(function(l){SL=Array.isArray(l)?l:[];document.getElementById("l").innerHTML=SL.length?SL.map(function(p,i){var c=parseFloat(p.sellPrice)*G.usd;return'<div class=c><div class=r><img src="'+p.productImage+'"><div style="flex:1"><b>'+p.productNameEn+'</b><div class=mu>custo '+R(c)+' → venda <b>'+R(pr(c))+'</b></div></div></div><label class=mu>ID da categoria Shopee</label><input id=ct'+i+' type=number><button onclick="pb('+i+')">Publicar na Shopee</button></div>'}).join(""):'<div class=c>Nada encontrado. '+JSON.stringify(l).slice(0,120)+'</div>'})}
function pb(i){var p=SL[i],ct=document.getElementById("ct"+i).value;if(!ct)return alert("Informe o ID da categoria");var c=parseFloat(p.sellPrice)*G.usd;
A("/api/publish",{method:"POST",body:JSON.stringify({pid:p.pid,name:p.productNameEn,img:p.productImage,price:pr(c).toFixed(2),stock:50,cat:ct,weight:.3})}).then(function(r){alert(r.error?r.error:r.response&&r.response.item_id?"Publicado! Item "+r.response.item_id:JSON.stringify(r).slice(0,300))})}
function bs(){var q=document.getElementById("q").value;document.getElementById("l").innerHTML="<p class=mu>Buscando…</p>";A("/api/cj?q="+encodeURIComponent(q)).then(function(l){SL=Array.isArray(l)?l:[];document.getElementById("l").innerHTML=SL.length?SL.map(function(p,i){var c=parseFloat(p.sellPrice)*G.usd;return'<div class=c><div class=r><img src="'+p.productImage+'"><div style="flex:1"><b>'+p.productNameEn+'</b><div class=mu>custo '+R(c)+' → venda <b>'+R(pr(c))+'</b> (frete médio)</div></div></div><label class=mu>Preço médio dos concorrentes na Shopee (R$)</label><input id=cp'+i+' type=number step=0.1><button onclick="vd('+i+')">Validar produto</button><div id=vd'+i+' style="margin-top:8px"></div></div>'}).join(""):'<div class=c>Nada encontrado. '+JSON.stringify(l).slice(0,120)+'</div>'})}
function vd(i){var p=SL[i],o=document.getElementById("vd"+i),cp=parseFloat(document.getElementById("cp"+i).value)||0;o.innerHTML="<span class=mu>Calculando frete…</span>";
A("/api/freight?pid="+p.pid).then(function(r){if(r.error||!r.opts||!r.opts.length)return o.innerHTML="Não achei frete para o Brasil. "+(r.error||"");
var c=(parseFloat(r.cost)||parseFloat(p.sellPrice))*G.usd,op=r.opts.slice().sort(function(a,b){return parseFloat(a.p)-parseFloat(b.p)})[0],f=parseFloat(op.p)*G.usd,dn=1-(G.com+G.imp+G.mar)/100,pv=(c+f+G.fixa)/Math.max(dn,.05);
var h="Custo "+R(c)+" + frete "+R(f)+" ("+op.n+", prazo "+(op.d||"?")+" dias)<br>Preço para "+G.mar+"% de margem: <b>"+R(pv)+"</b><br>Lucro: <b>"+R(pv*G.mar/100)+"</b>";
if(cp){var m=cp-c-f-G.fixa-cp*(G.com+G.imp)/100;h+="<br>Vendendo a "+R(cp)+": lucro "+R(m)+" ("+(m/cp*100).toFixed(0)+"%) → "+(m>0&&m/cp*100>=15?"✅ Validado":"⚠️ Margem baixa")}
o.innerHTML=h})}
  go();
</script></body></html>
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06080f"><title>Tierrez AI</title>
<style>

</style></head><body>
<header><div class="mono">T</div><div><h1>Tierrez<span>AI</span></h1><div class="sub">COMMERCE SUITE</div></div></header>
<div id="m"></div><nav id="n"></nav>
<script>
var T="home",SEG="shopee",SL=[],CH=[],PM=[],BRF=0,G={usd:5.5,mar:25,imp:4,com:14,fixa:4,mcom:14,mfixa:6};
try{G=Object.assign(G,JSON.parse(localStorage.tc))}catch(e){}
const $=id=>document.getElementById(id);
function K(){try{if(!localStorage.tk)localStorage.tk=prompt("Senha do app")}catch(e){}return localStorage.tk||""}

const R=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pr=(c,f,com,fx)=>(c+f+fx)/Math.max(1-(com+G.imp+G.mar)/100,.05);
function sv(k,v){G[k]=parseFloat(v)||0;localStorage.tc=JSON.stringify(G)}
const TABS=[["home","Painel"],["ped","Pedidos"],["cli","Clientes"],["prod","Produtos"],["cfg","Ajustes"]];
function set(h){$("m").innerHTML=h;$("n").innerHTML=TABS.map(t=>`<a class="${T==t[0]?"on":""}" onclick="T='${t[0]}';go()">${t[1]}</a>`).join("")}

function go(){set("<p class=mu>Carregando…</p>");
if(T=="home"){Promise.all([A("/api/status"),A("/api/ml/status")]).then(([s,m])=>{if(s.error)return set(`<div class=c>${s.error} <button class=g onclick="localStorage.removeItem('tk');go()">Tentar de novo</button></div>`);
const chip=(n,ok)=>`<div class=chip><i class="${ok?"ok":""}"></i>${n}</div>`;
set(`<div class="c hero"><div class=eyebrow>MISSÃO DE HOJE</div><h2>Validar seu primeiro produto</h2><p class=mu>Busque, calcule o frete real e a margem nas duas plataformas.</p><button onclick="T='prod';go()">Começar</button></div><div class=chips>${chip("Shopee",s.shopee)}${chip("Mercado Livre",m.ml)}${chip("CJ Dropshipping",s.cj)}</div><div class="c row"><div><b>Piloto automático</b><div class=mu>Compra pedidos Shopee na CJ e responde clientes a cada 5 min</div></div><button class=g onclick="A('/api/auto',{method:'POST'}).then(go)">${s.auto?"Desligar":"Ligar"}</button></div><h2>Atividade</h2>${s.log.slice(0,12).map(l=>`<div class=lg><b>${l.a}</b> · ${l.h.slice(11,16)}<br>${l.t}</div>`).join("")||"<div class=mu>Sem atividade ainda.</div>"}`)});return}
if(T=="ped"){A(SEG=="ml"?"/api/ml/orders":"/api/orders").then(o=>{if(o.error)return set(seg()+`<div class=c>${o.error}</div>`);
set(seg()+(o.length?o.map(x=>SEG=="ml"?`<div class=c><div class=row><b>#${x.id}</b><span class=tag>${x.status}</span></div><div class=mu>${x.items}</div><div>${R(x.total)}</div></div>`:`<div class=c><div class=row><b>${x.order_sn}</b><span class=tag>${x.order_status}</span></div><div class=mu>${(x.item_list||[]).map(i=>i.item_name+" ×"+i.model_quantity_purchased).join(", ")}</div><div class=btns>${x.order_status=="READY_TO_SHIP"?`<button onclick="this.disabled=1;A('/api/buy?sn=${x.order_sn}').then(()=>alert('Enviado à CJ'))">Comprar na CJ</button>`:""}<button class=g onclick="A('/api/ship?sn=${x.order_sn}').then(r=>alert(r.error||'Rastreio Shopee: '+(r.tracking||'gerando…')))">Organizar envio</button><button class=g onclick="A('/api/track?sn=${x.order_sn}').then(r=>alert(r.error||'Rastreio CJ: '+(r.track||'sem rastreio')))">Rastreio CJ</button></div></div>`).join(""):"<div class=c>Sem pedidos.</div>"))});return}
              if(T=="cli"){A(SEG=="ml"?"/api/ml/questions":"/api/chats").then(l=>{if(l.error)return set(seg()+`<div class=c>${l.error}</div>`);CH=l;
set(seg()+(l.length?l.map((c,i)=>`<div class=c><div class=row><b>${c.name}</b>${c.unread?`<span class=tag>${c.unread} nova(s)</span>`:""}</div><div class=mu>${c.text}</div><input id=rp${i} placeholder="Sua resposta"><button onclick="sd(${i})">Enviar</button></div>`).join(""):"<div class=c>Nada pendente.</div>"))});return}
if(T=="prod"){set(`<h2>Buscar produtos</h2><div class=row><input id=q placeholder="ex: cable organizer"><button onclick="bs(0)">Buscar</button></div><button class="g w" onclick="bs(1)">Só armazém no Brasil</button><div id=l></div>`);return}
if(T=="cfg"){set(`<h2>Conexões</h2><div class="c row"><b>Shopee</b><button class=g onclick="location='/auth/shopee?k='+K()">Conectar</button></div><div class="c row"><b>Mercado Livre</b><button class=g onclick="location='/auth/ml?k='+K()">Conectar</button></div><h2>Taxas e margem</h2><div class=c>${[["usd","Dólar (R$)"],["mar","Margem %"],["imp","Imposto %"],["com","Comissão Shopee %"],["fixa","Taxa fixa Shopee (R$)"],["mcom","Comissão Mercado Livre %"],["mfixa","Taxa fixa Mercado Livre (R$)"]].map(x=>`<label>${x[1]}</label><input type=number step=0.1 value="${G[x[0]]}" onchange="sv('${x[0]}',this.value)">`).join("")}<div class=mu>Confirme as taxas atuais no painel de cada plataforma.</div></div>`)}}
function sd(i){const v=$("rp"+i).value;if(!v)return;const c=CH[i];(SEG=="ml"?A("/api/ml/answer",{method:"POST",body:JSON.stringify({id:c.id,text:v})}):A("/api/say",{method:"POST",body:JSON.stringify({to:c.to,text:v})})).then(r=>{alert(r.error||"Enviado");go()})}
function bs(br){BRF=br?1:0;$("l").innerHTML="<p class=mu>Buscando…</p>";A(`/api/cj2?br=${BRF}&q=${encodeURIComponent($("q").value)}`).then(l=>{SL=Array.isArray(l)?l:[];
$("l").innerHTML=SL.length?SL.map((p,i)=>`<div class=c><div class=row style="align-items:flex-start"><img src="${p.productImage}"><div style="flex:1"><b>${p.productNameEn}</b><div class=mu>custo ${R(parseFloat(p.sellPrice)*G.usd)}${BRF?" · armazém BR":""}</div></div></div><label>Preço médio dos concorrentes (R$)</label><input id=cp${i} type=number step=0.1><button onclick="vd(${i})">Validar produto</button><div id=vd${i} style="margin-top:10px"></div></div>`).join(""):`<div class=c>${BRF?"Nenhum produto com armazém no Brasil. Tente outro termo ou busque sem o filtro. ":"Nada encontrado. "}${JSON.stringify(l).slice(0,120)}</div>`})}
function vd(i){const p=SL[i],o=$("vd"+i),cp=parseFloat($("cp"+i).value)||0;o.innerHTML="<span class=mu>Calculando frete…</span>";
A(`/api/freight2?br=${BRF}&pid=${p.pid}`).then(r=>{if(r.error||!r.opts||!r.opts.length)return o.innerHTML="Não achei frete para o Brasil. "+(r.error||"");
const c=(parseFloat(r.cost)||parseFloat(p.sellPrice))*G.usd,op=r.opts.slice().sort((a,b)=>parseFloat(a.p)-parseFloat(b.p))[0],f=parseFloat(op.p)*G.usd,ps=pr(c,f,G.com,G.fixa),pm=pr(c,f,G.mcom,G.mfixa);
let h=`<div class=mu>Custo ${R(c)} + frete ${R(f)} · ${op.n} · prazo ${op.d||"?"} dias</div><div class=prices><div><span>SHOPEE</span><b>${R(ps)}</b></div><div><span>MERCADO LIVRE</span><b>${R(pm)}</b></div></div><div class=mu>Preços para ${G.mar}% de margem</div>`;
if(cp){const m=cp-c-f-G.fixa-cp*(G.com+G.imp)/100,pc=m/cp*100;h+=`<div class=vd>${m>0&&pc>=15?"✅ Validado":"⚠️ Margem baixa"} · lucro ${R(m)} (${pc.toFixed(0)}%) a ${R(cp)} na Shopee</div>`}
PM[i]=pm;o.innerHTML=h+`<label>Título em português (para o Mercado Livre)</label><input id=tt${i}><button class=g onclick="pubml(${i})">Publicar no Mercado Livre</button>`})}
function pubml(i){const p=SL[i],t=$("tt"+i).value.trim();if(!t)return alert("Digite o título em português");if(!confirm("Publicar por "+R(PM[i])+"?"))return;
A("/api/ml/publish",{method:"POST",body:JSON.stringify({title:t.slice(0,60),price:+PM[i].toFixed(2),qty:5,img:p.productImage})}).then(r=>alert(r.error||(r.permalink?"Publicado: "+r.permalink:JSON.stringify(r).slice(0,300))))}
go();
</script></body></html>
